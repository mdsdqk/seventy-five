<!doctype html>
<html class="dark" lang="en" style="">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Seventy Five Dashboard</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "secondary-fixed": "#e5e2e1",
              "surface-variant": "#353535",
              "surface-tint": "#c6c6c6",
              "on-error-container": "#ffdad6",
              "surface-container-highest": "#353535",
              "surface-container-low": "#1b1b1b",
              "on-primary-fixed-variant": "#454747",
              "on-primary-container": "#636465",
              "primary-fixed-dim": "#c6c6c6",
              "tertiary-fixed-dim": "#88d982",
              "on-primary-fixed": "#1a1c1c",
              background: "#131313",
              "on-secondary-container": "#bab8b7",
              "error-container": "#93000a",
              "on-error": "#690005",
              tertiary: "#ffffff",
              "inverse-surface": "#e2e2e2",
              "surface-container": "#1f1f1f",
              "on-tertiary-fixed-variant": "#005312",
              "secondary-fixed-dim": "#c8c6c5",
              "on-secondary-fixed": "#1c1b1b",
              "tertiary-container": "#a3f69c",
              "secondary-container": "#4a4949",
              "on-background": "#e2e2e2",
              "inverse-primary": "#5d5f5f",
              "on-tertiary": "#003909",
              "outline-variant": "#444748",
              "on-tertiary-fixed": "#002204",
              secondary: "#c8c6c5",
              "surface-dim": "#131313",
              surface: "#131313",
              error: "#ffb4ab",
              "on-primary": "#2f3131",
              "inverse-on-surface": "#303030",
              "on-secondary-fixed-variant": "#474646",
              "surface-container-high": "#2a2a2a",
              "primary-container": "#e2e2e2",
              outline: "#8e9192",
              "tertiary-fixed": "#a3f69c",
              "on-secondary": "#313030",
              "primary-fixed": "#e2e2e2",
              primary: "#ffffff",
              "on-tertiary-container": "#237329",
              "surface-bright": "#393939",
              "surface-container-lowest": "#0e0e0e",
              "on-surface-variant": "#c4c7c8",
              "on-surface": "#e2e2e2",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              xxl: "80px",
              xs: "4px",
              lg: "24px",
              xl: "40px",
              gutter: "24px",
              md: "16px",
              unit: "4px",
              "container-max": "1200px",
              sm: "8px",
            },
            fontFamily: {
              "display-lg-mobile": ["Playfair Display"],
              "label-caps": ["Inter"],
              "body-md": ["Inter"],
              "headline-md": ["Playfair Display"],
              button: ["Inter"],
              "display-lg": ["Playfair Display"],
              "body-lg": ["Inter"],
              "headline-lg": ["Playfair Display"],
            },
            fontSize: {
              "display-lg-mobile": [
                "40px",
                { lineHeight: "1.1", letterSpacing: "-0.02em", fontWeight: "700" },
              ],
              "label-caps": [
                "12px",
                { lineHeight: "1", letterSpacing: "0.1em", fontWeight: "600" },
              ],
              "body-md": ["16px", { lineHeight: "1.6", fontWeight: "400" }],
              "headline-md": ["24px", { lineHeight: "1.3", fontWeight: "600" }],
              button: ["14px", { lineHeight: "1", letterSpacing: "0.05em", fontWeight: "500" }],
              "display-lg": [
                "64px",
                { lineHeight: "1.1", letterSpacing: "-0.02em", fontWeight: "700" },
              ],
              "body-lg": ["18px", { lineHeight: "1.6", fontWeight: "400" }],
              "headline-lg": ["32px", { lineHeight: "1.2", fontWeight: "600" }],
            },
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #131313;
        color: #e2e2e2;
      }
      .task-list-item {
        border-bottom: 1px solid #262626;
      }
      .task-list-item:last-child {
        border-bottom: none;
      }
      .progress-track {
        background-color: #262626;
      }
      .progress-fill {
        background-color: #e5e2e1;
      }
      .checkbox-custom {
        appearance: none;
        width: 24px;
        height: 24px;
        border: 1px solid #262626;
        background-color: transparent;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .checkbox-custom:checked {
        border-color: #88d982;
        background-color: transparent;
      }
      .checkbox-custom:checked::after {
        content: "\e5ca"; /* Material Symbol 'check' */
        font-family: "Material Symbols Outlined";
        font-size: 16px;
        color: #88d982;
        font-variation-settings: "FILL" 1;
      }
      input[type="range"] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 16px;
        width: 16px;
        border-radius: 50%;
        background: #e2e2e2;
        cursor: pointer;
        margin-top: -6px;
      }
      input[type="range"]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        cursor: pointer;
        background: #262626;
        border-radius: 2px;
      }
      input[type="range"]:focus {
        outline: none;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body class="antialiased min-h-screen flex flex-col font-body-md text-body-md pb-32">
    <!-- TopAppBar -->
    <header
      class="w-full top-0 sticky z-40 bg-background dark:bg-background border-b border-surface-variant dark:border-surface-variant transition-colors"
    >
      <div class="flex justify-between items-center px-gutter py-md max-w-container-max mx-auto">
        <button
          class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-high transition-colors active:opacity-80 p-2 -ml-2 rounded-full flex items-center justify-center"
        >
          <span class="material-symbols-outlined" data-icon="calendar_today">calendar_today</span>
        </button>
        <h1
          class="font-headline-md text-headline-md tracking-tighter uppercase font-display-lg text-primary dark:text-primary m-0"
        >
          SEVENTY FIVE
        </h1>
        <button
          class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-high transition-colors active:opacity-80 p-2 -mr-2 rounded-full flex items-center justify-center font-label-caps text-label-caps uppercase"
        >
          DAY 42
        </button>
      </div>
    </header>
    <!-- Main Content Canvas -->
    <main class="flex-grow w-full max-w-container-max mx-auto px-gutter pt-xl pb-xxl">
      <div class="max-w-3xl mx-auto space-y-lg">
        <!-- Nutrition -->
        <div class="task-list-item py-md flex items-start gap-md group">
          <div class="pt-1">
            <div
              class="w-8 h-8 flex items-center justify-center border border-surface-variant bg-transparent rounded-full"
            >
              <span
                class="material-symbols-outlined text-[#2E7D32]"
                style="font-variation-settings: &quot;FILL&quot; 1"
                >check_circle</span
              >
            </div>
          </div>
          <div class="flex-grow">
            <label class="cursor-pointer block" for="task-nutrition">
              <h2
                class="font-headline-md text-headline-md text-on-surface mb-xs group-hover:text-tertiary-fixed-dim transition-colors"
              >
                Nutrition
              </h2>
              <p class="text-on-surface-variant font-body-md text-body-md">
                Clean eating. No alcohol or cheat meals.
              </p>
            </label>
            <div class="mt-sm flex justify-end"></div>
          </div>
        </div>
        <!-- Workouts -->
        <div class="task-list-item py-md flex items-start gap-md group">
          <div class="pt-1">
            <input class="checkbox-custom" id="task-workouts" type="checkbox" />
          </div>
          <div class="flex-grow">
            <div class="flex justify-between items-baseline mb-xs">
              <h2 class="font-headline-md text-headline-md text-on-surface">Workouts</h2>
              <span class="font-label-caps text-label-caps text-on-surface-variant"
                >0/2 COMPLETED</span
              >
            </div>
            <div class="space-y-sm mt-sm">
              <button
                class="w-full flex items-center justify-center p-md bg-surface-container-low border border-dashed border-surface-variant hover:bg-surface-container-high transition-colors active:scale-95 min-h-[64px]"
              >
                <span class="material-symbols-outlined text-outline text-3xl">add</span>
              </button>
              <!-- Example of a dropdown flow (hidden by default)
<div class="p-md bg-surface-container-highest border border-surface-variant hidden">
    <select class="w-full bg-surface-container-low border border-surface-variant text-on-surface p-2 mb-sm">
        <option>Outdoor</option>
        <option>Indoor</option>
    </select>
    <input type="number" placeholder="Duration (min)" class="w-full bg-surface-container-low border border-surface-variant text-on-surface p-2 mb-sm" />
    <button class="w-full bg-primary text-on-primary py-2 font-label-caps uppercase">Add</button>
</div>
-->
            </div>
            <div class="mt-md flex flex-wrap gap-sm"></div>
          </div>
        </div>
        <!-- Water -->
        <div class="task-list-item py-md flex items-start gap-md group">
          <div class="pt-1">
            <input class="checkbox-custom" id="task-water" type="checkbox" />
          </div>
          <div class="flex-grow">
            <div class="flex justify-between items-baseline mb-sm">
              <h2 class="font-headline-md text-headline-md text-on-surface">Water</h2>
              <span class="font-label-caps text-label-caps text-on-surface-variant"
                >64 / 128 OZ</span
              >
            </div>
            <div class="flex items-center gap-sm mt-sm mb-md">
              <button
                class="w-8 h-8 flex items-center justify-center border border-surface-variant rounded-full hover:bg-surface-container-high"
              >
                -
              </button>
              <input class="flex-grow" max="128" min="0" type="range" value="64" />
              <button
                class="w-8 h-8 flex items-center justify-center border border-surface-variant rounded-full hover:bg-surface-container-high"
              >
                +
              </button>
            </div>
          </div>
        </div>
        <!-- Reading -->
        <div class="task-list-item py-md flex items-start gap-md group">
          <div class="pt-1">
            <input class="checkbox-custom" id="task-reading" type="checkbox" />
          </div>
          <div class="flex-grow">
            <div class="flex justify-between items-baseline mb-xs">
              <h2 class="font-headline-md text-headline-md text-on-surface">Reading</h2>
              <span class="font-label-caps text-label-caps text-on-surface-variant"
                >5 / 10 PAGES</span
              >
            </div>
            <p class="text-on-surface-variant font-body-md text-body-md mb-sm">
              Non-fiction daily requirement.
            </p>
            <div class="flex items-center gap-sm mt-sm mb-sm">
              <button
                class="w-8 h-8 flex items-center justify-center border border-surface-variant rounded-full hover:bg-surface-container-high"
              >
                -
              </button>
              <input class="flex-grow" max="10" min="0" type="range" value="5" />
              <button
                class="w-8 h-8 flex items-center justify-center border border-surface-variant rounded-full hover:bg-surface-container-high"
              >
                +
              </button>
            </div>
          </div>
        </div>
        <!-- Progress Picture -->
        <div class="task-list-item py-md flex items-start gap-md group">
          <div class="pt-1">
            <input class="checkbox-custom" id="task-photo" type="checkbox" />
          </div>
          <div class="flex-grow">
            <h2 class="font-headline-md text-headline-md text-on-surface mb-xs">
              Progress Picture
            </h2>
            <button
              class="w-full mt-sm flex flex-col items-center justify-center p-xl bg-surface-container-low border border-dashed border-surface-variant hover:bg-surface-container-high transition-colors active:scale-95 group"
            >
              <span
                class="material-symbols-outlined text-outline text-4xl mb-2 group-hover:text-primary transition-colors"
                >photo_camera</span
              >
              <span
                class="font-label-caps text-label-caps text-on-surface-variant group-hover:text-on-surface transition-colors"
                >Tap to add daily photo</span
              >
            </button>
          </div>
        </div>
      </div>
    </main>
    <!-- Modern Chat Input -->
    <div class="fixed bottom-16 md:bottom-20 left-0 w-full z-40 px-gutter pointer-events-none">
      <div class="max-w-3xl mx-auto pointer-events-auto">
        <div
          class="bg-surface-container-highest rounded-full border border-surface-variant p-2 flex items-center gap-sm shadow-lg"
        >
          <button
            class="w-10 h-10 flex flex-shrink-0 items-center justify-center text-on-surface-variant hover:text-primary hover:bg-surface-container-high rounded-full transition-colors active:scale-95"
          >
            <span class="material-symbols-outlined">add</span>
          </button>
          <input
            class="bg-transparent border-none flex-grow text-on-surface font-body-md focus:ring-0 placeholder:text-on-surface-variant placeholder:opacity-50 px-2"
            placeholder="Message..."
            type="text"
          />
          <button
            class="w-10 h-10 flex flex-shrink-0 items-center justify-center text-on-surface-variant hover:text-primary hover:bg-surface-container-high rounded-full transition-colors active:scale-95"
          >
            <span class="material-symbols-outlined">photo_camera</span>
          </button>
          <button
            class="w-10 h-10 flex flex-shrink-0 items-center justify-center bg-primary text-on-primary rounded-full transition-colors active:scale-95"
          >
            <span class="material-symbols-outlined text-sm">send</span>
          </button>
        </div>
      </div>
    </div>
    <!-- BottomNavBar -->
    <nav
      class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-gutter pb-lg pt-sm bg-background border-t border-surface-variant md:hidden"
    >
      <a
        class="flex flex-col items-center justify-center p-2 text-primary dark:text-primary border-t-2 border-primary pt-2 active:scale-95 duration-100 transition-transform"
        href="#"
      >
        <span
          class="material-symbols-outlined"
          data-icon="grid_view"
          style="font-variation-settings: &quot;FILL&quot; 1"
          >grid_view</span
        >
      </a>
      <a
        class="flex flex-col items-center justify-center p-2 text-outline dark:text-outline pt-2 hover:text-primary transition-colors active:scale-95 duration-100"
        href="#"
      >
        <span class="material-symbols-outlined" data-icon="history">history</span>
      </a>
    </nav>
    <!-- Desktop Nav (Hidden on Mobile, simplified representation to follow rules) -->
    <nav
      class="hidden md:flex fixed top-0 left-0 h-full w-20 flex-col items-center py-xl bg-background border-r border-surface-variant z-50"
    >
      <div class="space-y-xl mt-xxl">
        <a
          class="flex flex-col items-center justify-center p-4 text-primary dark:text-primary border-l-2 border-primary hover:bg-surface-container-high transition-colors"
          href="#"
        >
          <span
            class="material-symbols-outlined"
            data-icon="grid_view"
            style="font-variation-settings: &quot;FILL&quot; 1"
            >grid_view</span
          >
        </a>
        <a
          class="flex flex-col items-center justify-center p-4 text-on-surface-variant dark:text-on-surface-variant hover:text-primary hover:bg-surface-container-high transition-colors"
          href="#"
        >
          <span class="material-symbols-outlined" data-icon="history">history</span>
        </a>
      </div>
    </nav>
  </body>
</html>
