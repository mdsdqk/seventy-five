<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Seventy Five Widget</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Playfair+Display:wght@600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container-highest": "#353535",
              "inverse-surface": "#e2e2e2",
              "surface-container": "#1f1f1f",
              "primary-fixed": "#e2e2e2",
              "on-background": "#e2e2e2",
              outline: "#8e9192",
              "secondary-fixed": "#e5e2e1",
              error: "#ffb4ab",
              "inverse-on-surface": "#303030",
              "secondary-container": "#4a4949",
              "on-surface": "#e2e2e2",
              tertiary: "#ffffff",
              surface: "#131313",
              "on-tertiary": "#003909",
              "surface-container-high": "#2a2a2a",
              "primary-container": "#e2e2e2",
              "secondary-fixed-dim": "#c8c6c5",
              "primary-fixed-dim": "#c6c6c6",
              "tertiary-container": "#a3f69c",
              "on-primary": "#2f3131",
              "on-secondary-container": "#bab8b7",
              "on-error-container": "#ffdad6",
              "on-primary-fixed-variant": "#454747",
              "surface-dim": "#131313",
              "on-tertiary-fixed-variant": "#005312",
              "surface-container-low": "#1b1b1b",
              "outline-variant": "#444748",
              "surface-tint": "#c6c6c6",
              "surface-bright": "#393939",
              secondary: "#c8c6c5",
              "surface-container-lowest": "#0e0e0e",
              "on-tertiary-container": "#237329",
              "error-container": "#93000a",
              "tertiary-fixed-dim": "#88d982",
              "tertiary-fixed": "#a3f69c",
              primary: "#ffffff",
              "on-surface-variant": "#c4c7c8",
              "on-error": "#690005",
              "on-secondary": "#313030",
              "on-tertiary-fixed": "#002204",
              "inverse-primary": "#5d5f5f",
              "surface-variant": "#353535",
              "on-primary-fixed": "#1a1c1c",
              "on-primary-container": "#636465",
              "on-secondary-fixed-variant": "#474646",
              background: "#131313",
              "on-secondary-fixed": "#1c1b1b",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              xl: "40px",
              sm: "8px",
              "container-max": "1200px",
              xxl: "80px",
              lg: "24px",
              xs: "4px",
              md: "16px",
              gutter: "24px",
              unit: "4px",
            },
            fontFamily: {
              button: ["Inter"],
              "headline-lg": ["Playfair Display"],
              "label-caps": ["Inter"],
              "headline-md": ["Playfair Display"],
              "display-lg": ["Playfair Display"],
              "display-lg-mobile": ["Playfair Display"],
              "body-md": ["Inter"],
              "body-lg": ["Inter"],
            },
            fontSize: {
              button: ["14px", { lineHeight: "1", letterSpacing: "0.05em", fontWeight: "500" }],
              "headline-lg": ["32px", { lineHeight: "1.2", fontWeight: "600" }],
              "label-caps": [
                "12px",
                { lineHeight: "1", letterSpacing: "0.1em", fontWeight: "600" },
              ],
              "headline-md": ["24px", { lineHeight: "1.3", fontWeight: "600" }],
              "display-lg": [
                "64px",
                { lineHeight: "1.1", letterSpacing: "-0.02em", fontWeight: "700" },
              ],
              "display-lg-mobile": [
                "40px",
                { lineHeight: "1.1", letterSpacing: "-0.02em", fontWeight: "700" },
              ],
              "body-md": ["16px", { lineHeight: "1.6", fontWeight: "400" }],
              "body-lg": ["18px", { lineHeight: "1.6", fontWeight: "400" }],
            },
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #000000;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .widget-container {
        width: 340px;
        height: 340px;
        background-color: #121212;
        border: 1px solid #262626;
        padding: 24px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        color: #e2e2e2;
      }
      .progress-bar-track {
        height: 2px;
        background-color: #262626;
        width: 100%;
      }
      .progress-bar-fill {
        height: 2px;
        background-color: #e5e5e5;
        width: 50%; /* 64/128 */
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body>
    <div class="widget-container">
      <!-- Header -->
      <div class="flex justify-between items-start">
        <h1 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tighter">
          75
        </h1>
        <div
          class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest mt-2 border border-[#262626] px-2 py-1"
        >
          DAY 42
        </div>
      </div>
      <!-- Status Toggles -->
      <div class="flex justify-between items-center mt-md border-y border-[#262626] py-md">
        <div class="flex flex-col items-center gap-xs">
          <span
            class="material-symbols-outlined text-primary text-[20px]"
            style="font-variation-settings: &quot;FILL&quot; 1"
            >restaurant</span
          >
          <span class="font-label-caps text-label-caps text-on-surface-variant">NTR</span>
          <span class="material-symbols-outlined text-tertiary-container text-[16px]">check</span>
        </div>
        <div class="flex flex-col items-center gap-xs">
          <span
            class="material-symbols-outlined text-primary text-[20px]"
            style="font-variation-settings: &quot;FILL&quot; 1"
            >menu_book</span
          >
          <span class="font-label-caps text-label-caps text-on-surface-variant">RD</span>
          <span class="material-symbols-outlined text-tertiary-container text-[16px]">check</span>
        </div>
        <div class="flex flex-col items-center gap-xs">
          <span class="material-symbols-outlined text-on-surface-variant text-[20px]"
            >fitness_center</span
          >
          <span class="font-label-caps text-label-caps text-on-surface-variant">WKO</span>
          <span class="font-label-caps text-label-caps text-primary">0/2</span>
        </div>
      </div>
      <!-- Water Tracking -->
      <div class="mt-auto">
        <div class="flex justify-between items-end mb-sm">
          <div class="font-label-caps text-label-caps text-outline">WATER</div>
          <div class="font-body-md text-body-md font-semibold">
            <span class="text-primary">64</span
            ><span class="text-on-surface-variant text-sm"> / 128 oz</span>
          </div>
        </div>
        <div class="progress-bar-track mb-md">
          <div class="progress-bar-fill"></div>
        </div>
        <div class="flex gap-sm">
          <button
            class="flex-1 border border-[#262626] bg-transparent hover:bg-surface-container-high transition-colors py-sm font-button text-button text-primary uppercase flex items-center justify-center gap-xs"
          >
            <span class="material-symbols-outlined text-[16px]">add</span> 16 oz
          </button>
          <button
            class="flex-1 border border-[#262626] bg-[#E5E5E5] text-[#000000] hover:bg-white transition-colors py-sm font-button text-button uppercase flex items-center justify-center gap-xs"
          >
            <span class="material-symbols-outlined text-[16px]">add</span> 32 oz
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
