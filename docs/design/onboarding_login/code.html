<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Seventy Five - Login</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Playfair+Display:wght@600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary-fixed": "#1c1b1b",
              "on-secondary-container": "#bab8b7",
              "tertiary-fixed-dim": "#88d982",
              "surface-container": "#1f1f1f",
              "on-tertiary-fixed": "#002204",
              "secondary-fixed": "#e5e2e1",
              "on-background": "#e2e2e2",
              "surface-bright": "#393939",
              "tertiary-fixed": "#a3f69c",
              "primary-container": "#e2e2e2",
              "on-secondary": "#313030",
              "surface-container-high": "#2a2a2a",
              "on-error": "#690005",
              "on-primary-fixed-variant": "#454747",
              "error-container": "#93000a",
              "inverse-surface": "#e2e2e2",
              secondary: "#c8c6c5",
              "on-secondary-fixed-variant": "#474646",
              "secondary-container": "#4a4949",
              "surface-container-highest": "#353535",
              "surface-variant": "#353535",
              "surface-dim": "#131313",
              surface: "#131313",
              "outline-variant": "#444748",
              "surface-tint": "#c6c6c6",
              outline: "#8e9192",
              "on-tertiary-fixed-variant": "#005312",
              "on-error-container": "#ffdad6",
              "surface-container-low": "#1b1b1b",
              "on-tertiary": "#003909",
              "on-surface": "#e2e2e2",
              "on-primary-fixed": "#1a1c1c",
              "primary-fixed": "#e2e2e2",
              "on-tertiary-container": "#237329",
              "secondary-fixed-dim": "#c8c6c5",
              "on-primary": "#2f3131",
              "primary-fixed-dim": "#c6c6c6",
              primary: "#ffffff",
              tertiary: "#ffffff",
              background: "#131313",
              "on-primary-container": "#636465",
              error: "#ffb4ab",
              "on-surface-variant": "#c4c7c8",
              "inverse-primary": "#5d5f5f",
              "tertiary-container": "#a3f69c",
              "inverse-on-surface": "#303030",
              "surface-container-lowest": "#0e0e0e",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              unit: "4px",
              xs: "4px",
              xxl: "80px",
              xl: "40px",
              lg: "24px",
              sm: "8px",
              gutter: "24px",
              "container-max": "1200px",
              md: "16px",
            },
            fontFamily: {
              "label-caps": ["Inter"],
              "headline-lg": ["Playfair Display"],
              "display-lg-mobile": ["Playfair Display"],
              button: ["Inter"],
              "headline-md": ["Playfair Display"],
              "body-md": ["Inter"],
              "body-lg": ["Inter"],
              "display-lg": ["Playfair Display"],
            },
            fontSize: {
              "label-caps": [
                "12px",
                { lineHeight: "1", letterSpacing: "0.1em", fontWeight: "600" },
              ],
              "headline-lg": ["32px", { lineHeight: "1.2", fontWeight: "600" }],
              "display-lg-mobile": [
                "40px",
                { lineHeight: "1.1", letterSpacing: "-0.02em", fontWeight: "700" },
              ],
              button: ["14px", { lineHeight: "1", letterSpacing: "0.05em", fontWeight: "500" }],
              "headline-md": ["24px", { lineHeight: "1.3", fontWeight: "600" }],
              "body-md": ["16px", { lineHeight: "1.6", fontWeight: "400" }],
              "body-lg": ["18px", { lineHeight: "1.6", fontWeight: "400" }],
              "display-lg": [
                "64px",
                { lineHeight: "1.1", letterSpacing: "-0.02em", fontWeight: "700" },
              ],
            },
          },
        },
      };
    </script>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body
    class="bg-background text-on-background min-h-screen flex flex-col md:flex-row antialiased font-body-md overflow-hidden"
  >
    <!-- Left Image Section (Editorial) -->
    <div
      class="relative w-full md:w-1/2 h-[353px] md:h-screen bg-surface-container flex-shrink-0 border-b md:border-b-0 md:border-r border-surface-variant overflow-hidden"
    >
      <div
        class="absolute inset-0 bg-cover bg-center opacity-80 mix-blend-luminosity"
        data-alt="A striking, high-contrast black and white editorial photography shot of a disciplined athlete intensely focused. The lighting is dramatic, highlighting muscle definition and evoking a sense of raw power and endurance. The background is pure, deep shadow, focusing entirely on the figure. High-end, luxury fitness aesthetic."
        style="
          background-image: url(&quot;https://lh3.googleusercontent.com/aida-public/AB6AXuDxHeM21uUJo-atveiBRNCfDlluHvDtkZ75Xj38buK2TFIbqaRPoaZ9xLWtxpqmsH-XvoDoqrKFbnIXVSCwPLu_fbl1XKExxKB9dyPPMDNf5ivr3O0BFGoxaisqh1OiNHi-DvtqH6PPKqyjB-CQM6C0TZDXSN6K1W0ffB2fqGql_0QQsBAOikdWNKOfpJExwcPOlSO3jMM-8mEVFw30KVXh5HZ1ujQXeSPIZtKWQD8B4Fs7o8QZhubOzL_L9pxGqRkt5WecA0rdMJc&quot;);
        "
      ></div>
      <div
        class="absolute inset-0 bg-gradient-to-b from-transparent to-background/90 md:to-background/40"
      ></div>
      <div class="absolute bottom-0 left-0 p-lg w-full">
        <h1
          class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-primary max-w-sm uppercase"
        >
          The Path to Permanence
        </h1>
      </div>
    </div>
    <!-- Right Login Section -->
    <div
      class="w-full md:w-1/2 flex items-center justify-center p-gutter min-h-[530px] md:min-h-screen bg-background relative"
    >
      <div class="w-full max-w-[400px] flex flex-col gap-xl">
        <!-- Brand Header -->
        <div class="text-center md:text-left pb-lg">
          <h2
            class="font-headline-md text-headline-md text-primary tracking-tighter uppercase mb-sm"
          >
            Seventy Five
          </h2>
          <p class="font-body-md text-body-md text-on-surface-variant">Enter your discipline.</p>
        </div>
        <!-- Login Form -->
        <form class="flex flex-col gap-lg w-full">
          <div class="flex flex-col gap-sm">
            <label class="font-label-caps text-label-caps text-on-surface uppercase" for="email"
              >Email Address</label
            >
            <input
              class="bg-transparent border-0 border-b border-surface-variant text-primary font-body-md text-body-md px-0 py-md focus:ring-0 focus:border-primary transition-colors uppercase placeholder:text-surface-variant placeholder:font-label-caps placeholder:text-label-caps"
              id="email"
              placeholder="ENTER YOUR EMAIL"
              type="email"
            />
          </div>
          <button
            class="w-full bg-secondary-fixed text-on-secondary-fixed font-button text-button uppercase py-md px-lg flex items-center justify-center gap-sm hover:bg-primary transition-colors group mt-sm rounded-none border border-transparent"
            type="button"
          >
            CONTINUE
            <span
              class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform"
              >arrow_forward</span
            >
          </button>
        </form>
        <!-- Separator -->
        <div class="flex items-center gap-md">
          <div class="h-px bg-surface-variant flex-1"></div>
          <span class="font-label-caps text-label-caps text-on-surface-variant">OR</span>
          <div class="h-px bg-surface-variant flex-1"></div>
        </div>
        <!-- Social Logins -->
        <div class="flex flex-col gap-md w-full">
          <button
            class="w-full bg-transparent border border-surface-variant text-on-surface font-button text-button py-md px-lg flex items-center justify-center gap-sm hover:border-outline hover:text-primary transition-colors rounded-none"
            type="button"
          >
            <span class="material-symbols-outlined text-[18px]">g_mobiledata</span>
            Continue with Google
          </button>
          <button
            class="w-full bg-primary text-background font-button text-button py-md px-lg flex items-center justify-center gap-sm hover:opacity-90 transition-opacity rounded-none border border-transparent"
            type="button"
          >
            <span
              class="material-symbols-outlined text-[18px]"
              style="font-variation-settings: &quot;FILL&quot; 1"
              >apps</span
            >
            Continue with Apple
          </button>
        </div>
        <!-- Legal -->
        <div class="text-center md:text-left mt-lg">
          <p class="font-label-caps text-[10px] text-on-surface-variant leading-relaxed">
            BY CONTINUING, YOU AGREE TO OUR
            <a class="text-primary hover:underline" href="#">TERMS OF SERVICE</a> AND
            <a class="text-primary hover:underline" href="#">PRIVACY POLICY</a>.
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
