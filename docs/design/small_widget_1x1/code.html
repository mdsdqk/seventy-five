<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Seventy Five Widget</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Playfair+Display:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container-highest": "#353535",
              "inverse-surface": "#e2e2e2",
              "surface-container": "#1f1f1f",
              "primary-fixed": "#e2e2e2",
              "on-background": "#e2e2e2",
              outline: "#8e9192",
              "secondary-fixed": "#e5e2e1",
              error: "#ffb4ab",
              "inverse-on-surface": "#303030",
              "secondary-container": "#4a4949",
              "on-surface": "#e2e2e2",
              tertiary: "#ffffff",
              surface: "#131313",
              "on-tertiary": "#003909",
              "surface-container-high": "#2a2a2a",
              "primary-container": "#e2e2e2",
              "secondary-fixed-dim": "#c8c6c5",
              "primary-fixed-dim": "#c6c6c6",
              "tertiary-container": "#a3f69c",
              "on-primary": "#2f3131",
              "on-secondary-container": "#bab8b7",
              "on-error-container": "#ffdad6",
              "on-primary-fixed-variant": "#454747",
              "surface-dim": "#131313",
              "on-tertiary-fixed-variant": "#005312",
              "surface-container-low": "#1b1b1b",
              "outline-variant": "#444748",
              "surface-tint": "#c6c6c6",
              "surface-bright": "#393939",
              secondary: "#c8c6c5",
              "surface-container-lowest": "#0e0e0e",
              "on-tertiary-container": "#237329",
              "error-container": "#93000a",
              "tertiary-fixed-dim": "#88d982",
              "tertiary-fixed": "#a3f69c",
              primary: "#ffffff",
              "on-surface-variant": "#c4c7c8",
              "on-error": "#690005",
              "on-secondary": "#313030",
              "on-tertiary-fixed": "#002204",
              "inverse-primary": "#5d5f5f",
              "surface-variant": "#353535",
              "on-primary-fixed": "#1a1c1c",
              "on-primary-container": "#636465",
              "on-secondary-fixed-variant": "#474646",
              background: "#131313",
              "on-secondary-fixed": "#1c1b1b",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              xl: "40px",
              sm: "8px",
              "container-max": "1200px",
              xxl: "80px",
              lg: "24px",
              xs: "4px",
              md: "16px",
              gutter: "24px",
              unit: "4px",
            },
            fontFamily: {
              button: ["Inter"],
              "headline-lg": ["Playfair Display"],
              "label-caps": ["Inter"],
              "headline-md": ["Playfair Display"],
              "display-lg": ["Playfair Display"],
              "display-lg-mobile": ["Playfair Display"],
              "body-md": ["Inter"],
              "body-lg": ["Inter"],
            },
            fontSize: {
              button: [
                "14px",
                {
                  lineHeight: "1",
                  letterSpacing: "0.05em",
                  fontWeight: "500",
                },
              ],
              "headline-lg": [
                "32px",
                {
                  lineHeight: "1.2",
                  fontWeight: "600",
                },
              ],
              "label-caps": [
                "12px",
                {
                  lineHeight: "1",
                  letterSpacing: "0.1em",
                  fontWeight: "600",
                },
              ],
              "headline-md": [
                "24px",
                {
                  lineHeight: "1.3",
                  fontWeight: "600",
                },
              ],
              "display-lg": [
                "64px",
                {
                  lineHeight: "1.1",
                  letterSpacing: "-0.02em",
                  fontWeight: "700",
                },
              ],
              "display-lg-mobile": [
                "40px",
                {
                  lineHeight: "1.1",
                  letterSpacing: "-0.02em",
                  fontWeight: "700",
                },
              ],
              "body-md": [
                "16px",
                {
                  lineHeight: "1.6",
                  fontWeight: "400",
                },
              ],
              "body-lg": [
                "18px",
                {
                  lineHeight: "1.6",
                  fontWeight: "400",
                },
              ],
            },
          },
        },
      };
    </script>
    <style>
      .circular-progress {
        transform: rotate(-90deg);
      }
      .circular-progress circle {
        transition: stroke-dashoffset 0.5s ease-in-out;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body class="bg-black text-on-background flex items-center justify-center min-h-screen p-4">
    <!-- 1x1 Widget Container (simulated size 160x160) -->
    <div
      class="w-[160px] h-[160px] bg-background rounded-3xl p-4 flex flex-col items-center justify-center relative shadow-sm border border-surface-variant overflow-hidden group hover:scale-105 transition-transform duration-300"
    >
      <!-- Subtle gradient overlay -->
      <div
        class="absolute inset-0 bg-gradient-to-br from-surface-container-high/20 to-transparent pointer-events-none"
      ></div>
      <!-- Progress Ring -->
      <div class="absolute inset-0 flex items-center justify-center">
        <svg class="w-[140px] h-[140px] circular-progress" viewBox="0 0 100 100">
          <!-- Track -->
          <circle
            class="stroke-surface-container-highest"
            cx="50"
            cy="50"
            fill="none"
            r="45"
            stroke-width="4"
          ></circle>
          <!-- Progress (e.g., 60% completion -> 283 * 0.4 = 113 offset) -->
          <circle
            class="stroke-primary"
            cx="50"
            cy="50"
            fill="none"
            r="45"
            stroke-dasharray="282.743"
            stroke-dashoffset="113"
            stroke-linecap="round"
            stroke-width="4"
          ></circle>
        </svg>
      </div>
      <!-- Content -->
      <div class="relative z-10 flex flex-col items-center">
        <span
          class="font-label-caps text-label-caps text-on-surface-variant tracking-widest uppercase mb-1"
          >Day</span
        >
        <span class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tighter"
          >42</span
        >
      </div>
    </div>
  </body>
</html>
